[package]
name    = "kitetsu"
version = "0.1.0"
edition = "2024"

[lib]
name = "kitetsu"
path = "src/lib.rs"

[features]
# Only whisper is wired now; whisperfile/onnx compile but return BackendNotCompiled.
default      = ["whisper"]
whisper      = ["dep:transcribe-rs", "transcribe-rs/whisper-cpp"]
whisperfile  = ["dep:transcribe-rs", "transcribe-rs/whisperfile"]
onnx         = ["dep:transcribe-rs", "transcribe-rs/onnx"]

[dependencies]
# PulseAudio / PipeWire-pulse audio capture — §5.1 table.
# libpulse-binding is the base crate that provides Sample::Spec, Direction,
# Context, and the standard Mainloop needed for device introspection.
# libpulse-simple-binding provides the high-level blocking record API.
libpulse-binding        = "2"
libpulse-simple-binding = "2"

# Speech-recognition backends — §5.1 table (Decision #19).
# Optional: only compiled when a backend feature is active.
transcribe-rs = { version = "0.3", default-features = false, optional = true }

# Async runtime for spawn_blocking (capture + inference stay on blocking threads).
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Structured logging — §5.1 table.
tracing = "0.1"

# Library-level errors — §5.1 table / §5 code style.
thiserror = "2"

[dev-dependencies]
# Used only at binary edges (examples) where anyhow is allowed.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"
