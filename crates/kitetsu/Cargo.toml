[package]
name = "kitetsu"
version = "0.1.0"
edition = "2024"

[lib]
name = "kitetsu"
path = "src/lib.rs"

[features]
# Moonshine via transcribe-rs/onnx is the default STT backend (Decision #21/#22).
# Enable --features whisper to keep the Whisper GGML path for comparison.
default = ["onnx"]
onnx = ["dep:transcribe-rs", "transcribe-rs/onnx"]
# Pass-through for AMD ROCm inference via ort — wired but unused until gfx1150
# iGPU support is production-ready on Linux (see Decision #21 in KITETSU_PLAN.md).
ort-rocm = ["onnx", "transcribe-rs/ort-rocm"]
whisper = ["dep:whisper-rs"]
whisperfile = ["dep:transcribe-rs", "transcribe-rs/whisperfile"]
# OpenAI REST transcription backend (Decision #25). Off by default — pulls in
# reqwest; the local Moonshine/Whisper paths need no network stack.
api = [
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:base64",
]

[dependencies]
# PulseAudio / PipeWire-pulse audio capture — §5.1 table.
libpulse-binding = "2"
libpulse-simple-binding = "2"

# Direct whisper.cpp bindings — used for the `whisper` feature (Decision #20).
# transcribe-rs is kept only for future whisperfile/onnx backends (Decision #19).
whisper-rs = { version = "0.16", default-features = false, optional = true }
transcribe-rs = { version = "0.3", default-features = false, optional = true }

# Async runtime for spawn_blocking (capture + inference stay on blocking threads).
# `time` is needed for the progress-polling sleep in the example and future UI pipe.
# `net` is needed by tokio-tungstenite's TCP connector (api/realtime). `sync` is
# needed for the unbounded_channel bridge from std::sync::mpsc to async (realtime).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }

# Structured logging — §5.1 table.
tracing = "0.1"

# Library-level errors — §5.1 table / §5 code style.
thiserror = "2"

# OpenAI REST transcription backend (`api` feature). reqwest is the §5.1 LLM-HTTP
# choice; rustls-tls avoids an OpenSSL system dep (Nix-friendly). serde/serde_json
# parse the `{ "text": ... }` response. §5.1 table — no separate dependency ask.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "multipart",
], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# OpenAI Realtime WebSocket transcription backend (`api` feature, Decision #28).
# Approved outside §5.1 (2026-06-13): tokio-tungstenite (WS client, rustls-tls
# for Nix-friendly TLS), futures-util (split sink/stream, StreamExt/SinkExt),
# base64 (encode PCM16 frames for input_audio_buffer.append).
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
], optional = true }
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
], optional = true }
base64 = { version = "0.22", optional = true }

[[example]]
name = "moonshine_transcribe"
required-features = ["onnx"]

[[example]]
name = "moonshine_quant_transcribe"
required-features = ["onnx"]

[[example]]
name = "live_moonshine_transcribe"
required-features = ["onnx"]

[[example]]
name = "transcribe_audio"
required-features = ["whisper"]

[[example]]
name = "api_transcribe"
required-features = ["api"]

[[example]]
name = "live_api_transcribe"
required-features = ["api"]

[dev-dependencies]
# Used only at binary edges (examples) where anyhow is allowed.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
