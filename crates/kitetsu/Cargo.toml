[package]
name = "kitetsu"
version = "0.1.0"
edition = "2024"

[lib]
name = "kitetsu"
path = "src/lib.rs"

[features]
# Only whisper is wired now; whisperfile/onnx compile but return BackendNotCompiled.
default = ["whisper"]
whisper = ["dep:whisper-rs"]
whisperfile = ["dep:transcribe-rs", "transcribe-rs/whisperfile"]
onnx = ["dep:transcribe-rs", "transcribe-rs/onnx"]

[dependencies]
# PulseAudio / PipeWire-pulse audio capture — §5.1 table.
libpulse-binding = "2"
libpulse-simple-binding = "2"

# Direct whisper.cpp bindings — used for the `whisper` feature (Decision #20).
# transcribe-rs is kept only for future whisperfile/onnx backends (Decision #19).
whisper-rs = { version = "0.16", default-features = false, optional = true }
transcribe-rs = { version = "0.3", default-features = false, optional = true }

# Async runtime for spawn_blocking (capture + inference stay on blocking threads).
# `time` is needed for the progress-polling sleep in the example and future UI pipe.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Structured logging — §5.1 table.
tracing = "0.1"

# Library-level errors — §5.1 table / §5 code style.
thiserror = "2"

[dev-dependencies]
# Used only at binary edges (examples) where anyhow is allowed.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
